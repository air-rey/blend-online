# blendxr.online — private deal room on Netlify.
#
# Only ./public ships. Everything else is server side or source of truth
# that lives alongside the deployed files but is NOT uploaded. The post-
# build check in scripts/post-build-check.sh greps the published tree for
# known-private filenames and fails the build if any slip through.

[build]
  publish    = "public"
  functions  = "netlify/functions"
  command    = "npm run build"

[build.environment]
  # Node 22 has native WebSocket. @supabase/supabase-js initialises the
  # realtime client on createClient() and throws on Node <22 if no
  # transport is provided. Node 22 avoids pulling in `ws`.
  NODE_VERSION = "22"

# Clean URLs for the server-rendered deal room routes.
[[redirects]]
  from   = "/r"
  to     = "/.netlify/functions/brief"
  status = 200

[[redirects]]
  from   = "/r/*"
  to     = "/.netlify/functions/brief/:splat"
  status = 200

[[redirects]]
  from   = "/agreement"
  to     = "/.netlify/functions/agreement"
  status = 200

[[redirects]]
  from   = "/nda"
  to     = "/.netlify/functions/nda"
  status = 200

[[redirects]]
  from   = "/my-nda"
  to     = "/.netlify/functions/download-nda"
  status = 200

[[redirects]]
  from   = "/media/*"
  to     = "/.netlify/functions/media/:splat"
  status = 200

[[redirects]]
  from   = "/download/*"
  to     = "/.netlify/functions/download-url/:splat"
  status = 200

# Client portal. Static page; data comes from Supabase as the signed-in
# portal user, under RLS. No server code and no service role key here.
[[redirects]]
  from   = "/portal"
  to     = "/portal/index.html"
  status = 200

# Scheduled jobs. Netlify fires the function at `schedule` (UTC cron)
# with no HTTP request body; the function also responds to manual POSTs
# for QA.
[functions."day0-reminder"]
  schedule = "0 9 * * *"

# Server-rendered briefs read their markdown off disk. Netlify's bundler
# auto-includes files referenced with a static __dirname path, but list
# them explicitly so a future rename doesn't silently drop a brief from
# the bundle.
[functions."brief"]
  included_files = [
    "private-content/volga-test-scene/brief.md",
    "private-content/apexdream-confined-space/brief.md"
  ]

# Deal room pages must never be indexed and must never be cached by a
# shared cache. Function responses set their own headers too; this is a
# belt-and-suspenders rule for the static gate page.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag        = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy     = "no-referrer"
    Permissions-Policy  = "camera=(), microphone=(), geolocation=()"

# Client portal: no caching of the page, strict CSP. Only same-origin
# scripts, styles and fonts; network only to this site and the Supabase
# project. Inline style attributes are allowed for chart positions only.
[[headers]]
  for = "/portal"
  [headers.values]
    Cache-Control = "private, no-store"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://sgzltnhmxywjslvjwaif.supabase.co wss://sgzltnhmxywjslvjwaif.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

[[headers]]
  for = "/portal/*"
  [headers.values]
    Cache-Control = "private, no-store"
    Content-Security-Policy = "default-src 'none'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self' https://sgzltnhmxywjslvjwaif.supabase.co wss://sgzltnhmxywjslvjwaif.supabase.co; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
