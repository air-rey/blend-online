<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client portal</title>
<link rel="icon" type="image/svg+xml" href="/strata-mark.svg">
<link rel="stylesheet" href="/portal/login.css">
</head>
<body>

<main class="gate" aria-label="Client portal">
  <svg class="gate__mark" viewBox="0 0 64 64" aria-hidden="true">
    <g transform="translate(32 32) rotate(-16)" fill="none" stroke="currentColor" stroke-width="1.4">
      <ellipse cx="0" cy="-10" rx="26" ry="3.4" opacity=".45"/>
      <ellipse cx="0" cy="-5"  rx="27" ry="3.8" opacity=".7"/>
      <ellipse cx="0" cy="0"   rx="28" ry="4.2"/>
      <ellipse cx="0" cy="5"   rx="27" ry="3.8" opacity=".7"/>
      <ellipse cx="0" cy="10"  rx="26" ry="3.4" opacity=".45"/>
    </g>
  </svg>

  <h1 class="gate__title">Client portal.</h1>
  <p class="gate__sub">Enter your 5-digit code to continue.</p>

  <form class="gate__form" id="portalForm" novalidate>
    <input type="text" name="code" id="portalCode"
           inputmode="numeric" pattern="[0-9]*" maxlength="5"
           placeholder="&bull; &bull; &bull; &bull; &bull;"
           class="gate__input gate__input--code" autocomplete="off"
           aria-label="5-digit access code" spellcheck="false">

    <button type="submit" class="gate__submit" id="portalSubmit">
      <span>Enter</span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
        <path d="M5 12h14M13 6l6 6-6 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>

    <p class="gate__msg" id="portalMsg" aria-live="polite"></p>
  </form>
</main>

<script src="/portal/config.js"></script>
<script src="/portal/vendor/supabase-2.109.0.js"></script>
<script src="/portal/session.js"></script>
<script src="/portal/login.js"></script>
</body>
</html>
